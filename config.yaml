# Pipeline de Execução (Ordem Lógica):
# "CameraCalibration" -> "OpenCV" -> "Normalize" -> "Reconstruction" -> "Visualization"
execution_mode: "Reconstruction"
remote_mode: false
reconstruction_mode: stereo #mono/stereo

paths:
  # 1. Calibração
  calibration_images: "data/in/images_calibrations"
  calibration_output_folder: "data/out/calibrations"
  parameters:
    calibration:
      checkerboard_size: [ 8, 6 ]
    acquisition:
      desired_fps: 5

  # 2. Extração de Frames
  video_input: "data/in/videos"
  frames_output: "data/out/frames"

  # 3. Reconstrução
  colmap_input: "data/out/frames/mono"
  colmap_input_stereo: "data/out/frames/stereo" #Onde cada projeto possui subpasta direita e esquerda
  colmap_output: "data/out/reconstructions"
  resources: "resources"

  # 4. Remoto
  video_input_remote: "/home/bhzinn/Vídeos/Hidamari/goku.mp4"
  frames_output_remote: "data/out/frames"
  colmap_input_remote: "data/out/frames/Images"
  colmap_output_remote: "data/out/reconstructions"
  resources_remote: "resources"

  # 5.  Normalização
  frames_input_normalização: "data/out/frames"
  frames_output_normalização: "data/out/normalizados"